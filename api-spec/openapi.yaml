openapi: 3.1.0
info:
  title: Axene Payments API
  version: 0.1.0
  summary: Unified payment API for Axene merchants.
  description: |
    **Status: Phase 1.** Payments can be created, retrieved and cancelled.
    The only provider available is a clearly labelled **simulated provider**
    in development and sandbox deployments; no real payment rail is
    connected. Nothing here describes behaviour that is not implemented.

    ## Conventions (apply to every endpoint)

    - **Authentication**: `Authorization: Bearer <secret API key>`. Keys are
      bound to one merchant and one environment (`sk_test_…` sandbox,
      `sk_live_…` live). Operational endpoints are unauthenticated.
    - **Correlation**: every response carries `X-Request-Id`. Clients may send
      their own (1–128 chars of `A–Z a–z 0–9 - _ .`); otherwise one is
      generated. Quote it when contacting support.
    - **Idempotency**: every `POST` that can create a financial effect requires
      an `Idempotency-Key` header. See the `IdempotencyKey` parameter.
    - **Money**: `amount` is an integer in the currency's minor unit
      (KES 100.00 → `10000`) with an ISO 4217 `currency`. Never a float.
    - **Timestamps**: RFC 3339, UTC.
    - **IDs**: opaque prefixed strings (`pay_…`). Do not parse them.
    - **Errors**: always the `Error` envelope; branch on `type` and `code`,
      not on `message`.
    - **Compatibility**: within `/v1` changes are additive only. New response
      fields and new enum values may appear; clients must ignore unknown
      fields and handle unknown enum values.

    ## Payment status

    A payment is final only in `SUCCEEDED`, `FAILED`, `CANCELLED` or
    `REVERSED`. `PENDING_PROVIDER` and `PENDING_VERIFICATION` mean the outcome
    is not yet known; **do not treat them as failure and do not retry the
    payment with a new request** while one is pending. `UNRESOLVED` means
    Axene could not confirm the outcome automatically and is reconciling it
    with the provider; it can still become `SUCCEEDED` or `FAILED`.

    ## Webhooks

    Axene POSTs a JSON event to each subscribed endpoint:
    `{"id":"evt_…","object":"event","type":"payment.succeeded","api_version":"v1","created_at":…,"data":{"payment":{…}}}`.
    `data.payment` has the same shape as `GET /v1/payments/{payment_id}` and
    reflects the payment when the event was dispatched.

    - **Verify** every request: `Axene-Signature: t=<unix>,v1=<hex>` where
      `v1 = HMAC-SHA256(secret, t + "." + raw_body)`. Compare in constant
      time and reject timestamps more than 5 minutes old.
    - **Deduplicate** by `Axene-Event-Id`: delivery is at least once.
    - **Do not rely on order**; use the event type and payment status.
    - Respond with any **2xx** within 10 seconds. Other responses, timeouts
      and redirects are retried with exponential backoff for about 9 hours,
      after which the delivery is `dead` and can be replayed.
security:
  - apiKey: []

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Reports that the process is running. Does not check dependencies.
      tags: [Operations]
      security: []
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: ok }

  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: Reports whether the instance can serve traffic (PostgreSQL reachable within 2 seconds).
      tags: [Operations]
      security: []
      responses:
        "200":
          description: Ready.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
              example: { status: ready }
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/payments:
    post:
      operationId: createPayment
      summary: Create a payment
      description: |
        Creates a payment, routes it to a provider configured for the merchant,
        and sends the provider request. The response normally shows
        `PENDING_PROVIDER`: the customer has been prompted and the outcome is
        not yet known. Poll `GET /v1/payments/{payment_id}` for the final
        status.
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
            example:
              amount: 10000
              currency: KES
              payment_method: { type: mpesa, phone_number: "254712345678" }
              description: Order 1042
              merchant_reference: order-1042
      responses:
        "201":
          description: Payment created (or recovered for a retried request).
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/payments/{payment_id}:
    get:
      operationId: getPayment
      summary: Retrieve a payment
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The payment.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/payments/{payment_id}/cancel:
    post:
      operationId: cancelPayment
      summary: Cancel a payment
      description: |
        Cancels a payment that has not yet been sent to a provider. Once a
        provider request has been sent it cannot be withdrawn and this returns
        `409 payment_not_cancellable`. Cancelling an already cancelled payment
        returns it unchanged.
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The cancelled payment.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/webhook_endpoints:
    post:
      operationId: createWebhookEndpoint
      summary: Create a webhook endpoint
      description: |
        Registers an HTTPS URL to receive signed payment events. The response
        contains the signing `secret` **once**; store it securely to verify
        the `Axene-Signature` header. An empty `event_types` subscribes to
        every payment event.
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWebhookEndpointRequest" }
            example: { url: "https://merchant.example/axene/webhooks", event_types: [payment.succeeded, payment.failed] }
      responses:
        "201":
          description: Endpoint created; includes the signing secret.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listWebhookEndpoints
      summary: List webhook endpoints
      tags: [Webhooks]
      responses:
        "200":
          description: Endpoints for this merchant and environment (secrets are never returned).
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, const: list }
                  data: { type: array, items: { $ref: "#/components/schemas/WebhookEndpoint" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/webhook_endpoints/{endpoint_id}:
    get:
      operationId: getWebhookEndpoint
      summary: Retrieve a webhook endpoint
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "200":
          description: The endpoint.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/webhook_endpoints/{endpoint_id}/disable:
    post:
      operationId: disableWebhookEndpoint
      summary: Disable a webhook endpoint
      description: Stops deliveries. Pending deliveries to the endpoint are marked dead.
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "200":
          description: The disabled endpoint.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/webhook_endpoints/{endpoint_id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List recent deliveries to an endpoint
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/EndpointId"
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Most recent deliveries first.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: { type: string, const: list }
                  data: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/webhook_deliveries/{delivery_id}:
    get:
      operationId: getWebhookDelivery
      summary: Retrieve a delivery with every attempt
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: The delivery and its attempt history.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/webhook_deliveries/{delivery_id}/replay:
    post:
      operationId: replayWebhookDelivery
      summary: Replay a delivered or dead delivery
      description: |
        Schedules the same event body again with a fresh attempt budget and a
        new signature. Returns `409 delivery_pending` while the delivery is
        still being retried automatically.
      tags: [Webhooks]
      parameters:
        - $ref: "#/components/parameters/DeliveryId"
      responses:
        "200":
          description: The rescheduled delivery.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }

  /callbacks/{provider}/{token}:
    post:
      operationId: receiveProviderCallback
      summary: Provider callback (provider-facing)
      description: |
        Receives asynchronous result notifications from payment providers.
        Not for merchants. The path token is a deployment secret. A callback
        is stored and treated as an unverified claim: it can move a payment
        to `PENDING_VERIFICATION` but never to a final status (ADR-0009).
        The body format is provider-specific.
      tags: [Provider callbacks]
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Callback durably stored.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: Secret API key (`sk_test_…` or `sk_live_…`).

  headers:
    RequestId:
      description: Correlation identifier for this request.
      schema: { type: string, maxLength: 128 }
    IdempotentReplayed:
      description: Present with value `true` when the response is a replay of an earlier request with the same Idempotency-Key.
      schema: { type: string, enum: ["true"] }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Unique key for this operation (1–255 printable ASCII characters, no
        spaces), scoped to the merchant and environment and retained for at
        least 24 hours. Replaying a completed request with the same key and
        identical body returns the original response with
        `Idempotent-Replayed: true`. Reusing a key with a different body
        returns `422 idempotency_key_reused`. A request still in progress
        returns `409 idempotency_in_progress`.
      schema: { type: string, minLength: 1, maxLength: 255, pattern: "^[!-~]+$" }
    EndpointId:
      name: endpoint_id
      in: path
      required: true
      schema: { type: string, pattern: "^whe_[0-9A-HJKMNP-TV-Z]{26}$" }
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema: { type: string, pattern: "^whd_[0-9A-HJKMNP-TV-Z]{26}$" }
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema: { type: string, pattern: "^pay_[0-9A-HJKMNP-TV-Z]{26}$" }

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }

    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, payment_method]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in the currency's minor unit. M-Pesa accepts whole shillings only (multiples of 100 for KES).
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: ISO 4217 code. The simulated provider accepts KES.
        payment_method:
          type: object
          additionalProperties: false
          required: [type, phone_number]
          properties:
            type: { type: string, enum: [mpesa] }
            phone_number:
              type: string
              pattern: "^254[17][0-9]{8}$"
              description: Payer's MSISDN in international format without '+'.
        description: { type: string, maxLength: 200 }
        merchant_reference:
          type: string
          maxLength: 200
          description: Your own reference, e.g. an order ID.

    Payment:
      type: object
      required: [id, object, environment, status, status_reason, amount, currency, payment_method,
                 description, merchant_reference, settlement_destination, attempts, created_at, updated_at]
      properties:
        id: { type: string, pattern: "^pay_" }
        object: { type: string, const: payment }
        environment: { type: string, enum: [sandbox, live] }
        status:
          type: string
          enum: [CREATED, PENDING_PROVIDER, PENDING_VERIFICATION, UNRESOLVED, SUCCEEDED, FAILED, CANCELLED, REVERSED]
        status_reason:
          type: [string, "null"]
          description: Human-readable explanation of the latest status change. Do not parse.
        amount: { type: integer, format: int64 }
        currency: { type: string }
        payment_method:
          type: object
          required: [type, phone_number]
          properties:
            type: { type: string, enum: [mpesa] }
            phone_number: { type: string, description: Masked MSISDN. }
        description: { type: string }
        merchant_reference: { type: [string, "null"] }
        settlement_destination:
          type: object
          description: Where the provider settles the funds. Axene does not hold merchant funds.
          required: [id, type, identifier]
          properties:
            id: { type: string, pattern: "^dst_" }
            type: { type: string, enum: [mpesa_paybill, mpesa_till] }
            identifier: { type: string }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/PaymentAttempt" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaymentAttempt:
      type: object
      required: [id, provider, status, created_at, submitted_at, resolved_at]
      properties:
        id: { type: string, pattern: "^att_" }
        provider: { type: string }
        status:
          type: string
          enum: [PENDING_SUBMISSION, SUBMITTED, SUBMISSION_UNKNOWN, REJECTED, CONFIRMED_SUCCESS,
                 CONFIRMED_FAILURE, UNRESOLVED, ABANDONED]
        created_at: { type: string, format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }

    WebhookEventType:
      type: string
      enum: [payment.pending_provider, payment.pending_verification, payment.unresolved,
             payment.succeeded, payment.failed, payment.cancelled, payment.reversed]

    CreateWebhookEndpointRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, maxLength: 2048, description: HTTPS URL (http is accepted only in local development). }
        event_types: { type: array, items: { $ref: "#/components/schemas/WebhookEventType" } }
        description: { type: string, maxLength: 200 }

    WebhookEndpoint:
      type: object
      required: [id, object, url, event_types, description, status, created_at]
      properties:
        id: { type: string, pattern: "^whe_" }
        object: { type: string, const: webhook_endpoint }
        url: { type: string }
        event_types: { type: array, items: { $ref: "#/components/schemas/WebhookEventType" } }
        description: { type: string }
        status: { type: string, enum: [enabled, disabled] }
        secret:
          type: string
          pattern: "^whsec_"
          description: Signing secret. Present only in the response that creates the endpoint.
        created_at: { type: string, format: date-time }

    WebhookDelivery:
      type: object
      required: [id, object, endpoint_id, event_id, event_type, status, attempts, next_attempt_at,
                 last_status_code, last_error, delivered_at, created_at]
      properties:
        id: { type: string, pattern: "^whd_" }
        object: { type: string, const: webhook_delivery }
        endpoint_id: { type: string, pattern: "^whe_" }
        event_id: { type: string, pattern: "^evt_" }
        event_type: { $ref: "#/components/schemas/WebhookEventType" }
        status: { type: string, enum: [pending, delivered, dead] }
        attempts: { type: integer }
        next_attempt_at: { type: [string, "null"], format: date-time }
        last_status_code: { type: [integer, "null"] }
        last_error: { type: [string, "null"] }
        delivered_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        attempt_history:
          type: array
          description: Every HTTP attempt, oldest first. Present when retrieving a single delivery.
          items:
            type: object
            required: [attempted_at, status_code, error, duration_ms]
            properties:
              attempted_at: { type: string, format: date-time }
              status_code: { type: [integer, "null"] }
              error: { type: [string, "null"] }
              duration_ms: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message, request_id]
          properties:
            type:
              type: string
              description: Broad error category.
              enum:
                - invalid_request_error
                - authentication_error
                - permission_error
                - not_found_error
                - conflict_error
                - rate_limit_error
                - api_error
            code:
              type: string
              description: |
                Machine-readable error code, stable within a major version.
                Current codes: invalid_json, parameter_invalid, body_too_large,
                idempotency_key_required, idempotency_key_invalid,
                idempotency_key_reused, idempotency_in_progress,
                no_eligible_provider, missing_api_key, invalid_api_key,
                merchant_suspended, merchant_not_approved, payment_not_found,
                payment_not_cancellable, resource_not_found, delivery_pending,
                route_not_found, method_not_allowed,
                invalid_callback, not_ready, internal_error.
            message:
              type: string
              description: Human-readable explanation. May change; do not parse.
            param:
              type: string
              description: The request field the error relates to, if any.
            request_id:
              type: string
              description: Matches the X-Request-Id response header.

  responses:
    BadRequest:
      description: The request is malformed or a parameter is invalid.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or revoked API key.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The merchant may not perform this request (suspended, or not approved for live).
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such resource for this merchant and environment.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with the resource's state or an in-flight identical request.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: The request is valid JSON but cannot be processed (idempotency key reuse, no eligible provider).
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Unexpected server error. Safe to retry with the same Idempotency-Key.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotReady:
      description: A required dependency is unavailable.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
