name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: Unit tests (race detector)
        run: make test
      - name: Build binaries
        run: make build
      - name: Forbid floating point in the money path
        run: |
          if grep -rnE '\bfloat(32|64)\b' internal/platform/money --include='*.go'; then
            echo "floating point found in money package"; exit 1
          fi
      - name: govulncheck
        run: make vuln

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: axene
          POSTGRES_PASSWORD: axene_ci_only
          POSTGRES_DB: axene_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axene -d axene_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://axene:axene_ci_only@localhost:5432/axene_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests (race detector)
        run: make test-integration

  generated:
    name: Generated code is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Regenerate with sqlc built from source
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
      - name: Fail if generated code differs from what is committed
        run: |
          git status --porcelain internal/store
          test -z "$(git status --porcelain internal/store)"

  openapi:
    name: OpenAPI lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint contract
        run: npx --yes @redocly/cli@1 lint api-spec/openapi.yaml
